# lubobali.com — CI/CD (Gate 7 S7; production added Phase 8 L2.4).
# develop -> staging.lubobali.com, main -> lubobali.com. Same steps for both:
# check -> build -> deploy -> smoke test -> Lighthouse.
# Any failing check = nothing deployed. Failing smoke test or Lighthouse
# budget = auto-rollback.
# Design + security notes live in a private planning repo.
#
# Runs ONLY on the dedicated, sandboxed lubobali-runner (2 CPU / 3 GB /
# 256 pids, no docker socket, only the staging + prod deploy folders
# mountable).
# Never `ubuntu-latest` — that is LuBot's shared runner.

name: build-and-deploy

on:
  push:
    branches: [develop, main]
  # The private daily /building job (P7.10) starts this after it writes new
  # numbers, so they pass the same gates as code. Same branch, same steps.
  workflow_dispatch:

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"
  # Everything that differs between staging and production, picked by branch.
  SITE_ENV: ${{ github.ref_name == 'main' && 'prod' || 'staging' }}
  DEPLOY_ROOT: ${{ github.ref_name == 'main' && '/srv/lubobali-www/prod' || '/srv/lubobali-www/staging' }}
  SITE_URL: ${{ github.ref_name == 'main' && 'https://lubobali.com' || 'https://staging.lubobali.com' }}
  # Visit tracker (Phase 8 T3/T5): each site -> its own LuBot.
  # scripts/csp.mjs adds exactly this origin to connect-src.
  TRACK_URL: ${{ github.ref_name == 'main' && 'https://lubot.ai/api/track-click' || 'https://staging.lubot.ai/api/track-click' }}
  # SITE_RESOLVE (prod only, until the DNS switch) comes from the private
  # runner config: smoke + Lighthouse reach the box directly.

jobs:
  deploy:
    runs-on: lubobali
    timeout-minutes: 15
    container:
      volumes:
        - /srv/lubobali-www/staging:/srv/lubobali-www/staging
        # Prod builds also read staging's image cache + /building data.
        - /srv/lubobali-www/prod:/srv/lubobali-www/prod

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0 # full history for the secrets scan

      - name: Secrets scan (gitleaks, full history)
        run: gitleaks git . --config .gitleaks.toml --redact --no-banner --log-opts=--all

      - name: Install dependencies (lockfile only, install scripts blocked)
        run: pnpm install --frozen-lockfile

      - name: Vulnerability audit (high + critical fail the build)
        run: pnpm audit --prod --audit-level high

      # Every unit test file, before the build: a broken test fails in
      # seconds, and a new test file can never be left out (Phase 5 P5.2b).
      - name: Unit tests (scripts/tests/*.test.mjs)
        run: node --test scripts/tests/*.test.mjs

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: |
          pnpm exec next typegen
          pnpm exec tsc --noEmit

      - name: Contrast check (colour tokens, WCAG)
        run: node scripts/check-contrast.mjs

      - name: Build (static export)
        run: pnpm build
        env:
          # Reuse pictures already made for the live release (same name =
          # same bytes); only new ones are encoded. Saves ~30 s per run.
          IMAGE_CACHE: /srv/lubobali-www/staging/current/img
          # /building's real numbers (P7.9): written every morning by the
          # private daily job, next to the releases, never served. Missing
          # or broken file = the build fails (src/lib/building/load.ts).
          LIVE_DATA_FILE: /srv/lubobali-www/staging/data/live.json

      - name: SEO, AI-bot + CSP check (raw HTML, robots, sitemap, llms.txt, JSON-LD, script hashes)
        run: |
          node scripts/check-seo.mjs out
          node scripts/csp.mjs check out

      # Phase 9 P9.6: no private name (mystery clients, people) anywhere a
      # visitor or crawler can read. The list is a repo secret Lubo sets;
      # it is never in the repo or printed. Missing secret = fail.
      - name: Private-name guard (list from a repo secret, never printed)
        run: node scripts/check-private.mjs out content --require
        env:
          NOTES_PRIVATE_TERMS: ${{ secrets.NOTES_PRIVATE_TERMS }}

      - name: Test deploy scripts
        run: bash scripts/tests/test-deploy.sh

      - name: Deploy (atomic release switch)
        run: ./scripts/deploy.sh out "$DEPLOY_ROOT" "$(git rev-parse --short HEAD)"

      - name: Smoke test (auto-rollback on failure)
        run: |
          [ "$SITE_ENV" = prod ] || unset SITE_RESOLVE
          if ! ./scripts/smoke.sh "$SITE_URL" out "$SITE_ENV"; then
            echo "Smoke test failed -> rolling back"
            ./scripts/rollback.sh "$DEPLOY_ROOT" || echo "rollback: nothing older to roll back to"
            exit 1
          fi

      # Phone Lighthouse on the live pages, median of 3 runs; a page that
      # breaks a budget gets 2 more and is judged on the median of 5.
      # Hard budgets on indexable pages: LCP, CLS, TBT, requests,
      # accessibility, best practices, SEO. Speed score = warning only.
      - name: Lighthouse gate (auto-rollback on failure)
        run: |
          [ "$SITE_ENV" = prod ] || unset SITE_RESOLVE
          if ! node scripts/lighthouse.mjs "$SITE_URL" out "$SITE_ENV"; then
            echo "Lighthouse budget broken -> rolling back"
            ./scripts/rollback.sh "$DEPLOY_ROOT" || echo "rollback: nothing older to roll back to"
            exit 1
          fi

      # Production only, after every gate is green: tell IndexNow (Bing ->
      # ChatGPT search, Yandex) which pages are new or changed. Not sent =
      # a warning, never a failed deploy; the next deploy sends it again.
      - name: IndexNow (prod only, never fails the deploy)
        if: env.SITE_ENV == 'prod'
        run: node scripts/indexnow.mjs out "$DEPLOY_ROOT/indexnow-sent.json" "$SITE_URL" || echo "::warning::IndexNow not sent"
