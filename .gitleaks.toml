# gitleaks config for lubobali-com (Gate 7 S5, 2026-10-08).
# All default rules ON. CI (S7) runs gitleaks on every push to develop, so a
# secret can never reach the PUBLIC GitHub mirror.
# Pinned tool: ghcr.io/gitleaks/gitleaks:v8.30.1
#   @sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f

title = "lubobali-com"

[extend]
useDefault = true

# Only for `gitleaks dir` scans of the working tree: these folders are
# gitignored build output / deps (never committed). .next/ holds random
# per-build preview-mode keys that are not used by a static export.
[[allowlists]]
description = "gitignored build caches and dependencies"
paths = [
  '''(^|/)\.next/''',
  '''(^|/)node_modules/''',
  '''(^|/)out/''',
]

# Power BI "Publish to web" links (Phase 5, 2026-10-22): public by design
# (anyone with the link can view; they were already public on the old
# Framer site). Their r= value is base64 JSON {k: report id, t: tenant id,
# c: cluster}: no password or key, but the grafana-api-key rule reads the
# "eyJr" start as a Grafana key. Only this exact URL shape, only that rule.
[[allowlists]]
description = "Power BI public 'Publish to web' view links"
targetRules = ["grafana-api-key"]
regexTarget = "line"
regexes = ['''https://app\.powerbi\.com/view\?r=eyJrIjoi[A-Za-z0-9+/=]+''']
