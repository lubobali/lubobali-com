<!doctype html>
<!-- Resume PDF (Phase 6, P6.5). Lubo's v11 layout: 1 page, 1 column, real
     text, plain headings, no tables or text in images, so a company's ATS
     reads every field. Premium touch only: the site's fonts, one blue rule,
     the LB logo. Filled in by scripts/brand/resume-pdf.mjs from
     src/lib/resume.ts (scripts/lib/resume.mjs builds the HTML).
     No letter-spacing: it makes PDF text come out as "W O R K". -->
<html lang="en"><head><meta charset="utf-8"><title>Lubo Bali - Resume</title><style>
@font-face { font-family: "Fraunces"; src: url("../../src/app/fonts/Fraunces-latin-400.woff2") format("woff2"); font-weight: 400; }
/* Static 400 + 600 copies of the site's Inter Tight (fonts/README.md): Chrome
   turns a variable font into Type 3 glyphs, which some ATS can't read. */
@font-face { font-family: "Inter Tight"; src: url("fonts/InterTight-static-400.woff2") format("woff2"); font-weight: 400; }
@font-face { font-family: "Inter Tight"; src: url("fonts/InterTight-static-600.woff2") format("woff2"); font-weight: 600; }
@page { size: Letter; margin: 0.36in 0.5in 0.32in; }
* { margin: 0; padding: 0; box-sizing: border-box; }
:root { --ink: #0d1730; --muted: #46536d; --accent: #2f5fd6; }
body { font-family: "Inter Tight", Arial, sans-serif; font-size: 8.1pt; line-height: 1.24; color: var(--ink); }
a { color: inherit; text-decoration: none; }
header { position: relative; padding-bottom: 5pt; border-bottom: 1.4pt solid var(--accent); }
header .logo { position: absolute; right: 0; top: 0; height: 34pt; }
h1 { font-family: "Fraunces", Georgia, serif; font-weight: 400; font-size: 21pt; line-height: 1.05; }
.title { font-size: 10pt; font-weight: 600; color: var(--accent); margin-top: 1pt; }
.contact { font-size: 8.1pt; color: var(--muted); margin-top: 3pt; }
.contact a { color: var(--accent); }
h2 { font-size: 9.2pt; font-weight: 600; text-transform: uppercase; color: var(--accent); margin: 6pt 0 2pt;
  padding-bottom: 1.5pt; border-bottom: 0.5pt solid #c9d3e6; }
h3 { font-size: 8.6pt; font-weight: 600; text-transform: uppercase; }
.kind { font-weight: 500; text-transform: none; color: var(--muted); }
.item { margin-top: 3pt; break-inside: avoid; }
.row { display: flex; justify-content: space-between; align-items: baseline; gap: 12pt; }
.role { font-weight: 600; font-style: italic; }
.dates { white-space: nowrap; color: var(--muted); }
ul { padding-left: 11pt; }
li { margin-top: 0; }
li::marker { color: var(--accent); }
.stack { color: var(--muted); }
.stack a, .more a, .edu a { color: var(--accent); }
.skills { list-style: none; padding-left: 0; }
.edu { margin-top: 2pt; }
.more { margin-top: 4pt; }
</style></head>
<body><main id="resume"></main></body></html>
