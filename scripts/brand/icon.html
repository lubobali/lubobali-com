<!doctype html>
<!-- "LB" monogram for favicon / app icons. render.mjs sets --size. -->
<html><head><meta charset="utf-8"><style>
@font-face { font-family: "Inter Tight"; src: url("../../src/app/fonts/InterTight-latin-wght.woff2") format("woff2"); font-weight: 100 900; }
* { margin: 0; }
html, body { width: var(--size); height: var(--size); background: transparent; overflow: hidden; }
.mark { width: 100%; height: 100%; display: grid; place-items: center;
  background: #3a6ae0; color: #f8fafc; border-radius: var(--radius);
  font-family: "Inter Tight", sans-serif; font-weight: 700;
  font-size: calc(var(--size) * 0.5); letter-spacing: -0.04em; line-height: 1; }
</style></head><body><div class="mark">LB</div></body></html>
